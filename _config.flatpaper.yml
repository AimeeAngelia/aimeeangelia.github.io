# ============================================================
# FlatPaper 主题配置（站点级覆盖）
# 本文件只需写“你想覆盖的”主题选项，其余自动使用
# themes/flatpaper/_config.yml 中的默认值。
# 完整参考：themes/flatpaper/_config.en.yml
# ============================================================

# 导航菜单（桌面顶部 / 移动端抽屉）
menu:
  首页:
    link: /
    icon: home
  留言:
    link: /comment/
    # icon: message-circle
    icon: message-circle-more
  归档:
    link: /archives/
    icon: archive
  友链:
    link: /links/
    icon: link
  更多:
    icon: folder
    item:
      分类:
        link: /categories/
        icon: folder
      标签:
        link: /tags/
        icon: tag
  # 开往:
  #   link: https://www.travellings.cn/go.html
  #   icon: fa-solid:train-subway

# 品牌角标菜单（logo 左侧九宫格按钮），原站此处放自己的项目
nav:
  enable: false
  menu:
    - title: Project
      item:
        - name: TokenBoard
          link: https://tboard.nep.me/
          icon: gauge

# Favicon：使用站点头像生成的轻量方形图标。
favicon: /images/phrolova-avatar.png

# 背景特效
# 选项: default(默认纸纹) / grid(网格) / line(横线) / cross(十字星) / dotted(点阵)
background:
  style: default

# 默认主题色：orange | purple | sakura | blue | pink | green | black
color: sakura

# 胶带装饰总开关
tape:
  enable: true

# 标签样式： tape | pill
tags:
  style: tape

# 友链样式： default | tape
links:
  style: tape

# 图标按钮样式： circle（默认圆形，1px 虚线）| tape（手帐贴纸：墨团圆角、手贴歪斜、悬停胶带斜纹）
# 作用于：顶栏 logo/汉堡/搜索/调色盘/明暗切换、社交链接、文章反应按钮、TOC 折叠、搜索关闭、窄屏抽屉关闭
buttons:
  style: tape

# 页脚：
# - left 支持 HTML；占位符：{year}=当前年份，{name}=站点 _config.yml 的 author
# - powered 负责主题署名；设为 false 或配置 enable: false 可关闭
# - links 支持一维链接列表（一行）或二维链接列表（多行），同一行内用 " · " 分隔
# 不配置 footer 时默认：左 "© {year} {author}"，右 "Powered by Theme FlatPaper"
footer:
  left: "© {year} By {name}"
  powered:
    enable: true
    prefix: Powered by Theme
    name: FlatPaper
    link: https://github.com/Homulilly/hexo-theme-flatpaper
  links:
    - - name: 隐私政策
        link: /privacy/

# 作者卡片（侧栏）
profile:
  role: 落笔为誓
  bio: 许过的诺言，一定会实现。
  avatar: /images/phrolova-avatar.png
  avatar_shape: square
  site_info:
    posts: /archives/
    categories: /categories/
    tags: /tags/
  social:
    GitHub:
      url: https://github.com/AimeeAngelia
      icon: fa-brands:github
      tooltip: GitHub
    Steam:
      url: https://steamcommunity.com/id/yuzublanc/
      icon: fa-brands:steam
      tooltip: Steam
    Telegram:
      url: https://t.me/citrusecho
      icon: fa-brands:telegram
      tooltip: Telegram
    # TokenBoard:
    #   url: https://tboard.nep.me/
    #   icon: fa-solid:gauge
    #   tooltip: Token Board
    Bilibili:
      url: https://space.bilibili.com/501325496
      icon: fa-brands:bilibili
      tooltip: Bilibili
    抖音:
      url: https://v.douyin.com/-FfAxRn_Qpc/
      tooltip: 抖音
      svg: '<path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>'
  rss:
    enable: true
    path: /atom.xml

# 欢迎卡片（首页侧栏）
welcome:
  label: 弗洛洛
  title: 我等了很久，我不会再等了
  text: 别急着离开，这场演出还没有结束。
  cta_text: 与我合奏？你确定？
  cta_link: archives/
  image: /images/phrolova-welcome.png

# 首页开屏大图。默认关闭，不影响已有站点；仅在首页第一页渲染。
# 开启后默认复用 profile 的头像、简介、社交链接与 RSS，也可以在这里覆盖。
home_hero:
  enable: true
  title: Marginalia
  subtitle: 落笔为誓
  bio: 许过的诺言，一定会实现。
  avatar: /images/phrolova-avatar.png
  avatar_shape: square
  #
  # 背景图。留空时使用主题内置的手账纸张背景；设置后图片会铺满开屏。
  # 也可配置为数组，浏览器每次载入随机使用一张。
  image: /images/phrolova-concerto.jpg
  # image:
  #   - /images/hero-1.jpg
  #   - /images/hero-2.jpg
  # 移动端是否继续显示背景图；设为 false 时窄屏回退到纸张背景。
  mobile_image: true
  #
  # 背景图暗色遮罩透明度：[顶部, 底部]，范围 0-1。
  image_overlay: [0.2, 0.2]
  # 底部贴纸按钮的文字与目标锚点；默认进入首页内容区。
  cta_text: 开始阅读
  cta_link: "#flatpaper-home-content"
  # 贴纸按钮背景：01-09、random，或自定义图片路径。
  cta_background: random
  #
  # Hero 区域的快速导航链接。配置后将替代默认的波浪线分隔符。
  hero_links:
    - name: 文章
      link: /archives/
    - name: 分类
      link: /categories/
    - name: 留言
      link: /comment/
    # - name: Flatpaper Tools
    #   link: https://hexotag.nep.me
    #   alt: Flatpaper Tools
  # 一些贴纸装饰
  stickers:
    enable: true
    draggable: true
    # 内置便签贴纸的文字。
    note_text: 演出尚未落幕
    # 自定义图片贴纸最多渲染 5 张；加上内置便签后，开屏最多 6 个 sticker。link 可选，不配置则只是可拖动装饰。
    items:
      - image: /images/hero-sticker-encore.svg
        alt: Encore
        size: 132
      - image: /images/hero-sticker-lycoris.svg
        alt: 彼岸花
        size: 138
      - image: /images/hero-sticker-soundwave.svg
        alt: 霓虹声波
        size: 126
      # - image: /images/LKK.png
      #   alt: LKK
      #   size: 480
      # link: https://github.com/AimeeAngelia

# 首页文章卡片摘要的最大字符数（无 <!-- more --> 时按正文截断）
excerpt_length: 96
# 侧边栏随机文章展示数量
random_posts: 5
# 随机文章候选池大小；从生成期最新 N 篇中抽取，0 或留空表示不限
random_posts_pool: 100
# 文章页侧栏 TOC 下方的最新文章组件；默认关闭。limit 默认为 5。
latest_posts:
  enable: true
  limit: 5
# 文章页底部"相关文章"展示数量；0 表示禁用；不配置则默认 3 篇
related_posts: 4

# 精选文章（首页顶部：1 篇静态卡片 / 2-4 篇轮播）
featured:
  - create-a-minecraft-server
  - azure-for-student
featured_autoplay: 5000

# 首页 featured 图片左侧折线特效
featured_image_zigzag: true

# 文章页顶部图片：
# 留空禁用；top_img 只使用文章 front-matter 的 top_img；fallback 则 top_img 优先，缺省时按 cover/thumbnail/image/banner/正文首图解析。
post_top_img:
  mode: fallback

# 文章正文加粗文本是否使用主题色；设为 false 则只保留默认加粗。
article:
  strong_accent: true

# {% note %} 提示块外观风格：
#   flat      左侧实色条 + 淡背景填充（默认）
#   simple    无背景，仅左侧实色条 + 细边框 — 干净低调
#   modern    完全填充的圆角盒，无左侧条
#   sticky    便签贴纸：直角、右下微阴影，顶部中间条纹胶带
#   disabled  去掉所有装饰，保留语义结构
# icons：是否在正文/标题前显示圆形图标徽章（true | false）
note:
  style: sticky
  icons: true

# 代码块外观主题： simple | dark | sand | light
code:
  theme: simple

# 搜索（快捷键 Ctrl+K / Cmd+K）
search:
  limit: 0

google_fonts:
  enable: true
  cdn: https://fonts.loli.net
  text_font: New Tegomin
  text: ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789 !"#$%&'()*+,-./:;<=>?@[\]^_`{|}~

# Fancybox 图片灯箱（https://fancyapps.com/fancybox/）
# 启用后，文章页与独立页面（layout: page）的正文 <img> 自动用 Fancybox 包裹：
# 点击放大、左右键切换、ESC 关闭。同一页面内所有图片共属一个 gallery。
# 已被 <a> 包裹的图片不重复包裹；要单独排除某张图给它加 class="no-zoom"。
fancybox:
  enable: true
  # cdn_css:                            # 可选；覆盖默认 jsDelivr CSS
  # cdn_js:

# 评论系统选择： twikoo | artalk （留空 / 删除则不启用评论区）
# 只在文章和独立页面（layout: page）渲染；单篇可在 front-matter 用 `comments: false` 关闭。
comments: artalk

# Artalk（https://artalk.js.org，需自行部署后端 https://artalk.js.org/guide/deploy.html）
artalk:
  server: https://artalk.ueo.me/
  site: Marginalia # 站点名（需与 Artalk 后台已注册的站点一致）
  cdn_css: https://fastly.jsdelivr.net/npm/artalk@2.10.0/dist/Artalk.css # 可选；覆盖默认 jsDelivr CDN（私有镜像 / 企业 CDN）
  cdn_js: https://fastly.jsdelivr.net/npm/artalk@2.10.0/dist/Artalk.js

# Umami 网站统计（https://umami.is）
# enable 为 true 时，会在每个页面 </head> 前注入 Umami tracker：
#   <script defer src="https://<host>/script.js" data-website-id="<website_id>" [data-domains="..."]></script>
# host        Umami 服务的域名（不含协议、不含路径），例如 analytics.example.com
# website_id  后台为站点生成的 UUID
# domains     可选，逗号分隔或 YAML 列表，仅在这些域名下上报；用来过滤 localhost / 预览域名
umami:
  enable: false
  host: # 例如：analytics.example.com
  website_id: # 例如：xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
  # domains: example.com,www.example.com
